# Apache example for the Enhanced Living Whisperwood Smart Label Support Site.
#
# Replace support.your-domain.com with the real subdomain.
# Web root expects:
# /var/www/whisperwood-support-site -> /opt/whisperwood-support-site/repo/docs/support_portal

<VirtualHost *:80>
    ServerName support.your-domain.com
    DocumentRoot /var/www/whisperwood-support-site

    <Directory /var/www/whisperwood-support-site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.html

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/whisperwood-support-error.log
    CustomLog ${APACHE_LOG_DIR}/whisperwood-support-access.log combined
</VirtualHost>
