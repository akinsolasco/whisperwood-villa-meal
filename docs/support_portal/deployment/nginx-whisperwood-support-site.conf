# Nginx example for the Enhanced Living Whisperwood Smart Label Support Site.
#
# Replace support.your-domain.com with the real subdomain.
# Web root expects:
# /var/www/whisperwood-support-site -> /opt/whisperwood-support-site/repo/docs/support_portal

server {
    listen 80;
    server_name support.your-domain.com;

    root /var/www/whisperwood-support-site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
